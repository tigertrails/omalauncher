name: Lawnicons preview APK

on:
  workflow_dispatch:
  push:
    branches: [feature/native-lawnicons]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            17
            25
      - uses: gradle/actions/setup-gradle@v4
      - name: Install native build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-tools
          ndk=$(sed -n 's/^NDK_VERSION=//p' scripts/fetch-proot.sh)
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-37.0" "ndk;$ndk" "cmake;3.22.1" </dev/null >/dev/null
      - name: Restore stable test signing key
        env:
          TEST_KEYSTORE: ${{ secrets.LAWNICONS_TEST_KEYSTORE }}
        run: |
          test -n "$TEST_KEYSTORE"
          mkdir -p "$HOME/.android"
          printf '%s' "$TEST_KEYSTORE" | base64 --decode > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"
      - name: Build Linux runtime
        run: ./scripts/fetch-proot.sh
      - name: Test, lint and build isolated APK
        run: ./gradlew -PlawniconsTest -PlawniconsTestKeystore="$HOME/.android/debug.keystore" :owl:test :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
      - name: Sign and verify persistent test APK
        run: |
          apksigner=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)
          expected=$(keytool -exportcert -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey | sha256sum | cut -d' ' -f1)
          "$apksigner" sign --ks "$HOME/.android/debug.keystore" --ks-key-alias androiddebugkey --ks-pass pass:android --key-pass pass:android --out "$RUNNER_TEMP/lawnicons-signed.apk" app/build/outputs/apk/debug/app-debug.apk
          mv "$RUNNER_TEMP/lawnicons-signed.apk" app/build/outputs/apk/debug/app-debug.apk
          "$apksigner" verify --print-certs app/build/outputs/apk/debug/app-debug.apk > "$RUNNER_TEMP/apk-signature.txt"
          cat "$RUNNER_TEMP/apk-signature.txt"
          grep -Fiq "$expected" "$RUNNER_TEMP/apk-signature.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: omalauncher-lawnicons-preview
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lawnicons-test-reports
          path: |
            app/build/reports/
            owl/build/reports/
