name: Lawnicons test APK

on:
  workflow_dispatch:
  push:
    branches: [feature/native-lawnicons]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            17
            25
      - uses: gradle/actions/setup-gradle@v4
      - name: Install native build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-tools
          ndk=$(sed -n 's/^NDK_VERSION=//p' scripts/fetch-proot.sh)
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-37.0" "ndk;$ndk" "cmake;3.22.1" </dev/null >/dev/null
      - name: Build Linux runtime
        run: ./scripts/fetch-proot.sh
      - name: Test, lint and build isolated APK
        run: ./gradlew -PlawniconsTest :owl:test :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: omalauncher-lawnicons-test
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lawnicons-test-reports
          path: |
            app/build/reports/
            owl/build/reports/
